name = "omegle"
main = "worker.js"
compatibility_date = "2026-03-01"

# The built React app (npm run cf:build writes it here).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Let the Worker see the API before static files.
run_worker_first = ["/api/*", "/google56a3c710582c9ef5.html"]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]
